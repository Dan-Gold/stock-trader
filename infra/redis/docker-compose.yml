services:
  redis:
    image: redis:8.8.0  # Latest stable Redis (Jun 2026)
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app_network
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:3.0.2  # Latest stable RedisInsight (Jan 2026)
    container_name: redisinsight
    ports:
      - "5540:5540"
    networks:
      - app_network
    restart: unless-stopped
    depends_on:
      - redis
    profiles:
      - ui

networks:
  app_network:
    external: true