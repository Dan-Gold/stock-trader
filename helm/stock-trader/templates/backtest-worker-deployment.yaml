{{- if .Values.backtestWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stock-trader.fullname" . }}-backtest-worker
  labels:
    {{- include "stock-trader.labels" . | nindent 4 }}
    {{- include "stock-trader.selectorLabels" (dict "context" . "component" "backtest-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.backtestWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "stock-trader.selectorLabels" (dict "context" . "component" "backtest-worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.backtestWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stock-trader.labels" . | nindent 8 }}
        {{- include "stock-trader.selectorLabels" (dict "context" . "component" "backtest-worker") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backtest-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.backtestWorker.command | nindent 12 }}
          envFrom:
            {{- include "stock-trader.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.backtestWorker.resources | nindent 12 }}
      {{- with .Values.backtestWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backtestWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backtestWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
