services:

    # Stock Trader Base
  stock_trader_base:
    container_name: stock_trader_base
    image: stock_trader
    build:
      context: ../
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - dev.env
    networks:
      - app_network

  # Apply Database migrations
  stock_trader_db_init:
    container_name: stock_trader_db_init
    command: python -m stock_trader.db.migrations.create_database
    restart: "no"
    extends:
      service: stock_trader_base

  # Generate Database migrations
  stock_trader_db_migration:
    container_name: stock_trader_db_migration
    restart: "no"
    extends:
      service: stock_trader_base

  # Stock Trader API
  stock_trader_api:
    container_name: stock_trader_api
    depends_on:
      stock_trader_db_init:
        condition: service_completed_successfully
    command: ["uvicorn", "stock_trader.entrypoints.api_server:server", "--host", "0.0.0.0", "--port", "8000"]
    extends:
      service: stock_trader_base
    ports:
      - "8000:8000"

  # Stock Trader Worker (Celery)
  stock_trader_worker:
    container_name: stock_trader_worker
    command: python -m celery -A stock_trader.worker.celery_app:celery_app worker -Q backtest_queue
    depends_on:
      stock_trader_db_init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: 1
    extends:
      service: stock_trader_base

  # Flower for Celery monitoring
  flower:
    container_name: flower
    command: python -m celery -A stock_trader.worker.celery_app:celery_app flower --port=5555
    depends_on:
      stock_trader_db_init:
        condition: service_completed_successfully
    ports:
      - "5555:5555"
    extends:
      service: stock_trader_base

  # Stock Trader Tests
  stock_trader_tests:
    container_name: stock_trader_tests
    image: tests
    build:
      target: stock-trader-tests
    extends:
      service: stock_trader_base

networks:
  app_network:
    external: true