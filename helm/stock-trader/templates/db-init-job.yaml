{{- if .Values.dbInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stock-trader.fullname" . }}-db-init
  labels:
    {{- include "stock-trader.labels" . | nindent 4 }}
    {{- include "stock-trader.selectorLabels" (dict "context" . "component" "db-init") | nindent 4 }}
  annotations:
    # Run after every install/upgrade (so the postgresql subchart's Service
    # already exists), delete before a new hook is launched
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.dbInit.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "stock-trader.selectorLabels" (dict "context" . "component" "db-init") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import os
              import socket
              import time

              host = os.environ["DB_HOST"]
              port = int(os.environ["DB_PORT"])
              while True:
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          break
                  except OSError:
                      time.sleep(2)
          envFrom:
            {{- include "stock-trader.envFrom" . | nindent 12 }}
      containers:
        - name: db-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.dbInit.command | nindent 12 }}
          envFrom:
            {{- include "stock-trader.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.dbInit.resources | nindent 12 }}
{{- end }}
