apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stock-trader.fullname" . }}-config
  labels:
    {{- include "stock-trader.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # Database
  DB_USERNAME: {{ .Values.config.db.username | quote }}
  DB_NAME: {{ .Values.config.db.name | quote }}
  DB_HOST: {{ include "stock-trader.dbHost" . | quote }}
  DB_PORT: {{ .Values.config.db.port | quote }}
  # Redis
  REDIS_HOST: {{ include "stock-trader.redisHost" . | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_DB: {{ .Values.config.redis.db | quote }}
  REDIS_TTL: {{ .Values.config.redis.ttl | quote }}
  # Celery
  CELERY_BROKER_REDIS_DB: {{ .Values.config.celery.brokerRedisDb | quote }}
  CELERY_BACKEND_REDIS_DB: {{ .Values.config.celery.backendRedisDb | quote }}
  CELERY_TASK_RESULT_TTL: {{ .Values.config.celery.taskResultTtl | quote }}
