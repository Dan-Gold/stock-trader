services:
  postgres:
    image: postgres:17.7
    container_name: postgres
    env_file:
      - database.env
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - app_network
    restart: always

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    env_file:
      - database.env
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - app_network
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: always

volumes:
  pgadmin-data:
    external: true

networks:
  app_network:
    external: true
